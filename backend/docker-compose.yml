services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mota
      POSTGRES_USER: mota
      POSTGRES_PASSWORD: mota
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://mota:mota@db:5432/mota
      JWT_SECRET: change-me-in-production
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  postgres_data:
