services:
  db:
    image: postgres:16
    container_name: mota-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mota}
      POSTGRES_USER: ${POSTGRES_USER:-mota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mota}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mota} -d ${POSTGRES_DB:-mota}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mota-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mota}:${POSTGRES_PASSWORD:-mota}@db:5432/${POSTGRES_DB:-mota}
      PYTHONPATH: /app
    command: sh -c "alembic upgrade head && python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mota-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
